<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>Cadastro de Veículos</h1>
    <button onclick="document.getElementById('entryModal').style.display='block'">
        Cadastrar Veículo
    </button>
    <table>
        <thead>
            <tr>
                <th>Cavalo</th>
                <th>Carreta</th>
                <th>Tipo</th>
                <th>Transportadora</th>
            </tr>
        </thead>
        <tbody>
            {% for vehicle in vehicles %}
            <tr>
                <td>{{ vehicle.vehicle_plate }}</td>
                <td>{{ vehicle.cart_plate }}</td>
                <td>{{ vehicle.vehicle_type }}</td>
                <td>{{ vehicle.firm }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <div id="entryModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background-color:rgba(0,0,0,0.5);">
        <div style="background:#fff; margin:5% auto; padding:20px; width:50%; position:relative;">
            <span onclick="document.getElementById('entryModal').style.display='none'"
                  style="position:absolute; top:10px; right:15px; cursor:pointer;">&times;</span>
    
            <h2>Cadastrar Veículo</h2>
            <form method="post">
                {% csrf_token %}
                <label>Veículo:</label>
                <input type="text" name="vehicle_plate" required><br>
    
                <label>Carreta:</label>
                <input type="text" name="cart_plate"><br>
    
                <label>Tipo:</label>
                <select name="vehicle_type" required>
                    {% for vehicle_type in vehicle_types %}
                        <option value="{{ vehicle_type.id }}">{{ vehicle_type }}</option>
                    {% endfor %}
                </select><br>   
    
                <label>Transportadora:</label>
                <select name="firm" required>
                    {% for firm in firms %}
                        <option value="{{ firm.id }}">{{ firm }}</option>
                    {% endfor %}
                </select><br>
    
                <button type="submit">Cadastrar</button>
            </form>
        </div>
</body>
</html>
